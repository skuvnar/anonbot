# Builds the image and publishes it to ghcr.io/<owner>/<repo>.
#
# The first successful run creates the package as PRIVATE. Make it public once
# at Settings -> Packages -> anonbot -> Change visibility, or `docker pull`
# will ask for credentials.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Print the digest to publish
        run: echo "Published digest ${{ steps.build.outputs.digest }}"
